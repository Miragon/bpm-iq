name: Release (GHCR image)

# The ONE live-host artifact (ADR 0004): on-prem installs, the bpm-live Fly app (legacy-name-ok: its real name)
# and every SaaS cell run this exact image.
#   push to main   → ghcr.io/miragon/designiq-live-host:sha-<full-sha> + :edge
#   tag v*         → additionally :vX.Y.Z, :vX.Y and :latest
# The v* tag is cut by release-please (single whole-repo release; see
# release-please.yml). The sha- tag uses the FULL commit sha so a submodule pin
# maps to its image deterministically (`git rev-parse HEAD`, no short-sha
# ambiguity).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-host-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 via QEMU: on-prem hosts are often Apple Silicon / Graviton
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/miragon/designiq-live-host
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/live-host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
