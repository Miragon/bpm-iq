# Dependabot — balanced mode: minor+patch grouped per ecosystem, each major
# lands as its own PR for individual review. Reviewers come from CODEOWNERS.
version: 2
updates:
  # npm — one block covers the whole pnpm workspace (resolved from the root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # majors arrive as individual PRs — leave headroom above the default of 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # let new releases mature before a PR opens; security fixes are never delayed
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    # held back until the ecosystem catches up — drop the entry, don't raise it
    ignore:
      # 0.56 added an `exports` map, so the deep paths y-monaco 0.1.6 imports
      # ("monaco-editor/esm/vs/editor/editor.api.js") no longer resolve and the
      # web build fails. Unblock: a y-monaco release that drops the deep import.
      - dependency-name: "monaco-editor"
        versions: [">=0.56"]
      # typescript-eslint 8.x refuses to load against the TS 7 API, so `pnpm lint`
      # dies before it lints anything. Unblock: typescript-eslint TS >=7 support
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        versions: [">=7"]
      # inferno is not ours to pick: it is the renderer dmn-js's decision table
      # (table-js) draws with, and @bpmiq/decisions only declares it because the
      # simulation add-on's bundle imports it. Both peer on inferno 5
      # (table-js "^5.0.5", @emaarco/dmn-js-simulation ">=5.6 <6"), so a bump
      # here just puts a SECOND inferno major in the web bundle, rendering the
      # add-on's vnodes into dmn-js's inferno-5 tree. Unblock: dmn-js/table-js
      # moving to inferno 6+ — then this bump follows theirs.
      - dependency-name: "inferno"
        versions: [">=6"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # github-actions — SHA-pinned and CI-gated; majors are mostly mechanical, so
  # group everything. Monthly: workflows change slowly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # docker — base images for the two service Dockerfiles. A node major is a
  # runtime change, so it lands separately (minor+patch grouped).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/live-host"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
