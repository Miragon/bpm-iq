<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bpmiq decision modeler</title>
    <!-- boot config injected by the Live Host when serving the ui:// resource
         (apps/live-host/src/http/mcp.ts replaces the marker) -->
    <script>
      window.BPMIQ_BOOT = "__BPMIQ_BOOT__";
    </script>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="title">Loading…</span>
        <span id="dirty" hidden>●</span>
        <span class="spacer"></span>
        <button id="tests-toggle" title="Test cases for this decision">Tests</button>
        <button id="open" hidden>Open in bpmiq</button>
        <button id="fullscreen" title="Open fullscreen">⛶</button>
        <button id="save" hidden title="Changes save automatically — this forces it now">Save now</button>
      </div>
      <div id="banner" hidden></div>
      <div id="main">
        <div id="canvas"></div>
        <!-- the test panel (mcp-app/dmn-tests.ts owns everything inside) -->
        <aside id="tests" hidden>
          <div id="test-head">
            <strong>Test cases</strong>
            <span id="test-count" class="muted"></span>
            <span class="spacer"></span>
            <button id="test-run" title="Run every case against the saved decision">Run</button>
            <button id="test-hide" title="Close the panel">✕</button>
          </div>
          <div id="test-error" hidden></div>
          <!-- naming a captured run: an inline form, NEVER window.prompt() —
               MCP-App hosts sandbox the iframe without allow-modals, so a
               prompt() is silently ignored and the button appears dead -->
          <form id="test-form" hidden>
            <div id="test-form-given" class="muted"></div>
            <input id="test-name" placeholder="What does this case show?" maxlength="200" required />
            <div id="test-form-actions">
              <button type="button" id="test-cancel">Cancel</button>
              <button type="submit" id="test-submit">Capture</button>
            </div>
          </form>
          <div id="test-list"></div>
          <div id="test-empty">Enter values in the decision table, then capture the run as a test case.</div>
          <div id="coverage" hidden></div>
          <div id="test-foot">
            <button id="test-capture" title="Turn the values currently entered into a test case">
              ＋ Capture current run
            </button>
          </div>
        </aside>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/mcp-app/dmn-main.ts"></script>
  </body>
</html>
